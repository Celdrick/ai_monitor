# ai-monitor-agent configuration. Copy to /etc/ai-monitor/agent.yaml.
server_url: http://monitor.internal:8000
agent_token: <server 生成>
loki_url: http://monitor.internal:3100
listen: 0.0.0.0:9400
# advertise_address: 10.0.0.11:9400   # 可选：VictoriaMetrics 抓取地址，缺省自动探测本机 IP + listen 端口
scrape_interval_seconds: 15
heartbeat_interval_seconds: 30
services:              # 可选：手动登记 nohup/tmux 启动的 vLLM
  - name: qwen-72b
    port: 8001
    log_path: /var/log/vllm/qwen-72b.log
    profiler_dir: /data/vllm_profile/qwen-72b
discovery:
  docker: true
  process: true
  interval_seconds: 30
logs:
  enabled: true
  batch_lines: 500
  batch_interval_seconds: 1
  buffer_max_lines: 10000
state_dir: /var/lib/ai-monitor-agent/state
artifacts_dir: /var/lib/ai-monitor-agent/artifacts

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-monitor-agent"
version = "0.1.0"
description = "AI Monitor agent: GPU/NPU and host metrics exporter with server heartbeat"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "prometheus-client>=0.19",
    "psutil>=5.9",
    "httpx>=0.26",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "nvidia-ml-py>=12.535",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
ai-monitor-agent = "ai_monitor_agent.__main__:main"

[tool.setuptools.packages.find]
include = ["ai_monitor_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

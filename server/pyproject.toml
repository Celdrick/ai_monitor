[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-monitor-server"
version = "0.1.0"
description = "AI Monitor server: auth, agent registry, VictoriaMetrics proxy"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2",
    "asyncpg",
    "aiosqlite",
    "alembic",
    "pydantic-settings",
    "PyJWT",
    "bcrypt",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
]

[tool.setuptools.packages.find]
include = ["ai_monitor_server*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
